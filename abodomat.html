<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>أبودومات - إدارة أعمال</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial;background:#eaf6fb;margin:0;padding:10px;direction:rtl;text-align:right;font-size:16px;line-height:1.6}
h1,h2{font-size:22px;margin:10px 0}
label{display:block;margin:12px 0 4px;font-weight:bold}
input,select,button,textarea{width:100%;font-size:16px;padding:10px;min-height:44px;border:1px solid #999;border-radius:8px;background:#fff}
button{background:#0a7ec2;color:#fff;font-weight:bold;cursor:pointer}
button.green{background:#1a9e4a} button.red{background:#b00020} button.orange{background:#e67e00}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.tabs button{flex:1;min-width:110px}
.card{background:#fff;border-radius:10px;padding:12px;margin:12px 0}
.revBox{background:#e6f9e6;border:2px solid #1a9e4a;border-radius:10px;padding:12px;margin:12px 0}
.expBox{background:#fff0e0;border:2px solid #e67e00;border-radius:10px;padding:12px;margin:12px 0}
.profitBox{background:#e6f3f8;border-radius:10px;padding:12px;margin:12px 0}
table{width:100%;border-collapse:collapse;background:#fff}
th,td{border:1px solid #ccc;padding:8px;text-align:right;word-break:break-word}
th{background:#eee}
.scroll{overflow-x:auto}
.phoneRow,.dateRow{display:flex;gap:6px}
.phoneRow input{flex:2} .phoneRow select{flex:1}
.dateRow select{flex:1}
.hint{font-size:13px;color:#555}
.logoBox{text-align:center;background:#fff;border-radius:10px;padding:8px;margin:10px 0}
.logoBox img{max-width:100%}
.navRow{display:flex;gap:6px;flex-wrap:wrap} .navRow button{flex:1}
.hidden{display:none!important}
@media print{body *{visibility:hidden} #printArea, #printArea *{visibility:visible} #printArea{position:absolute;top:0;right:0;left:0} .noPrint{display:none!important}}
</style>
</head>
<body>
<div class="logoBox"><h1>شركة أبودومات للخدمات المتحدة المحدودة</h1><div>ABUDOMAT UNITED SERVICES CO. LTD</div></div>
<div class="tabs noPrint">
<button onclick="showTab('emp')">الموظفين</button>
<button onclick="showTab('inv')">الفواتير</button>
<button onclick="showTab('acc')">الحسابات</button>
<button onclick="showTab('board')">لوحة التحكم</button>
</div>

<!-- الموظفين -->
<div id="tab-emp" class="card hidden"><div id="empMain">
<h2>إضافة موظف جديد</h2>
<label>اسم الموظف</label><input id="eName" placeholder="مثال: محمد عبدالله">
<label>السكن</label><input id="eRes" placeholder="مثال: شندي - مربع 5">
<label>رقم الجوال</label><div class="phoneRow"><input id="ePhone" placeholder="9xxxxxxxx"><select id="ePhoneCode"><option>+249 السودان</option><option>+20 مصر</option><option>+966 السعودية</option><option>+971 الإمارات</option><option>+250 رواندا</option><option>+90 تركيا</option></select></div>
<label>الرقم الوطني</label><input id="eNid" placeholder="الرقم الوطني">
<label>نوع إثبات الهوية</label><select id="eIdType"><option>بطاقة شخصية</option><option>جواز سفر</option><option>رخصة قيادة</option></select>
<label>رقم الإثبات</label><input id="eIdNum">
<label>تاريخ الإصدار</label><div class="dateRow"><select id="eIdDay"></select><select id="eIdMonth"></select><select id="eIdYear"></select></div>
<label>تاريخ الانتهاء</label><div class="dateRow"><select id="eIdExpDay"></select><select id="eIdExpMonth"></select><select id="eIdExpYear"></select></div>
<label>الوظيفة</label><select id="eJob"><option>مشرف</option><option>عامل</option><option>سائق</option><option>محاسب</option><option>مهندس</option></select>
<label>موقع العمل</label><input id="eSite" list="sitesList" placeholder="مثال: مستشفى شندي"><datalist id="sitesList"><option value="مستشفى شندي"><option value="شركة الوكيل - جبرة"><option value="مصنع اللافتات - جبرة"></datalist>
<label>الإدارة / الفرع / القسم</label><input id="eDept" placeholder="مثال: النظافة - فرع شندي - قسم المستشفيات">
<label>الراتب</label><input id="eSalary" type="number" placeholder="500000">
<label>جهة الاتصال في الطوارئ / قريب</label><input id="eEmerg" placeholder="مثال: أخوه - 091xxxxxxx">
<label>نوع الإجازة</label><select id="eLeaveType"><option>سنوية</option><option>بدون أجر</option><option>مرضية - بشهادة</option><option>أمومة</option><option>عارضة</option></select>
<label>من تاريخ الإجازة</label><input id="eLeaveFrom" type="date">
<label>إلى تاريخ الإجازة</label><input id="eLeaveTo" type="date">
<button class="orange" onclick="addLeave()">حفظ إجازة للموظف المختار</button>
<div id="leaveList"></div>
<div id="expiryAlert" style="color:#b00020;font-weight:bold;margin:10px 0"></div>
<button class="green" onclick="addEmp()">حفظ الموظف</button>
<h2>الموظفون حسب الموقع</h2>
<label>عرض حسب الموقع</label><select id="siteFilter" onchange="showEmps()"><option value="">كل المواقع</option></select>
<div id="empList"></div>
</div>

<!-- الفواتير -->
<div id="tab-inv" class="card" style="display:none">
<h2>إضافة فاتورة</h2>
<label>اسم العميل</label><input id="iClient" placeholder="اسم العميل">
<label>نوع الفاتورة</label><select id="iType"><option>فاتورة مبدئية</option><option>فاتورة نهائية</option><option>إيصال</option></select>
<label>الدولة</label><select id="iCountry" onchange="updateStates()"></select>
<label>الولاية - للسودان فقط</label><select id="iState" onchange="updateCities()"></select>
<label>المدينة</label><select id="iCity"></select>
<label>رقم جوال العميل</label><div class="phoneRow"><input id="iPhone" placeholder="9xxxxxxxx"><select id="iPhoneCode"><option>+249 السودان</option><option>+20 مصر</option><option>+966 السعودية</option><option>+971 الإمارات</option><option>+250 رواندا</option></select></div>
<label>التاريخ</label><div class="dateRow"><select id="iDay"></select><select id="iMonth"></select><select id="iYear"></select></div>
<label>الخدمات - الخدمة المطلوبة</label><select id="iService" onchange="updateItems()"><option>استيراد</option><option>تصدير</option><option>نظافة</option><option>مقاولات / إنشاءات</option><option>تخليص جمركي</option><option>شحن</option><option>سياحة وسفر</option><option>خدمات تعليمية</option><option>استثمار</option><option>تسويق</option><option>استشارات</option><option>بيع وشراء سيارات</option></select>
<label>الصنف</label><select id="iItem"></select>
<label>طريقة تقديم الخدمة</label><select id="iMethod"><option>بري</option><option>بحري</option><option>جوي</option><option>مباشر في الموقع</option></select>
<label>ما الذي يتم شحنه / الخدمة المقدمة</label><input id="iShipped" placeholder="مثال: سكر - أسمنت - سمسم - ماشية">
<label>الكمية</label><input id="iQty" type="number" value="1">
<label>السعر</label><input id="iPrice" type="number" placeholder="0">
<button onclick="addItem()">إضافة للفاتورة</button>
<div id="invItems"></div>
<label>الإجمالي</label><input id="iTotal" readonly>
<div id="iTotalWords" class="hint"></div>
<button class="green" onclick="saveInv()">حفظ الفاتورة</button>
<button class="red" onclick="clearInvs()">حذف كل الفواتير</button>
<div id="printArea"></div>
<label>بحث في الفواتير</label><input id="invSearch" placeholder="اسم العميل" oninput="showInvs()">
<div id="invList"></div>
</div>

<!-- الحسابات -->
<div id="tab-acc" class="card" style="display:none">
<h2>الحسابات</h2>
<label>رأس المال</label><input id="aCapital" type="number" value="0">
<button onclick="saveCapital()">حفظ رأس المال</button>
<div class="revBox"><h2>إضافة إيراد</h2>
<label>وصف الإيراد</label><input id="rDesc" placeholder="مثال: دفعة من عميل">
<label>المبلغ</label><input id="rAmt" type="number">
<label>التاريخ</label><div class="dateRow"><select id="rDay"></select><select id="rMonth"></select><select id="rYear"></select></div>
<button class="green" onclick="addRev()">إضافة إيراد</button></div>
<div class="expBox"><h2>إضافة مصروف</h2>
<label>وصف المصروف</label><input id="eDesc" placeholder="مثال: مواد نظافة">
<label>المبلغ</label><input id="eAmt" type="number">
<label>التاريخ</label><div class="dateRow"><select id="eDay"></select><select id="eMonth"></select><select id="eYear"></select></div>
<button class="orange" onclick="addExp()">إضافة مصروف</button></div>
<div class="profitBox"><h2>الملخص المالي</h2><div id="summary"></div></div>
</div>

<!-- لوحة -->
<div id="tab-board" class="card" style="display:none">
<h2>لوحة التحكم</h2>
<label>ملاحظة / لوحة</label><input id="bText" placeholder="اكتب ملاحظة">
<button onclick="addBoard()">إضافة</button>
<div id="boardList"></div>
<div class="card"><h2>نسخ احتياطي</h2><button onclick="exportBackup()">تنزيل نسخة احتياطية</button><br><br><input type="file" id="importFile" onchange="importBackup(event)"></div>
</div>

<script>
let emps=JSON.parse(localStorage.getItem('emps')||'[]');
let invs=JSON.parse(localStorage.getItem('invs')||'[]');
let acc=JSON.parse(localStorage.getItem('acc')||'{"capital":0,"revs":[],"exps":[]}');
let board=JSON.parse(localStorage.getItem('board')||'[]');
let curItems=[];
const COUNTRY_CITIES={ "السودان":["الخرطوم","شندي","أم درمان","بحري","بورتسودان","كسلا","القضارف","مدني","الأبيض","نيالا","الدامر","عطبرة"], "مصر":["القاهرة","الجيزة","الإسكندرية","أسوان"], "السعودية":["الرياض","جدة","مكة","المدينة"], "الإمارات":["دبي","أبوظبي","الشارقة"], "رواندا":["كيغالي","موسانزي","هويي"], "تركيا":["اسطنبول","أنقرة","أفجلار"], "أخرى":["أخرى"] };
const SUDAN_STATES=["الخرطوم","نهر النيل","البحر الأحمر","الجزيرة","كسلا","القضارف","شمال كردفان","جنوب كردفان","شمال دارفور","جنوب دارفور","النيل الأبيض","النيل الأزرق","سنار","الشمالية"];
const ITEMS={"استيراد":["دقيق","سكر","سيارات","أسمنت","مواد غذائية"],"تصدير":["ماشية","سمسم","صمغ عربي","فول سوداني","كركدي"],"نظافة":["صابون","فلاش","ديتول","ملمع","مناديل","معقم"],"مقاولات / إنشاءات":["بناء","تشطيب","صيانة"],"تخليص جمركي":["تخليص وارد","تخليص صادر"],"شحن":["شحن بري","شحن بحري","شحن جوي"],"سياحة وسفر":["تذاكر","فيزا","حجز فندق"],"خدمات تعليمية":["قبول جامعي","دورات"],"استثمار":["دراسة جدوى","شراكة"],"تسويق":["حملة إعلانية","تصميم"],"استشارات":["استشارة إدارية","استشارة هندسية"],"بيع وشراء سيارات":["بيع سيارة","شراء سيارة"]};
function fillDate(d,m,y){let dd=document.getElementById(d),mm=document.getElementById(m),yy=document.getElementById(y);if(!dd)return;dd.innerHTML='';for(let i=1;i<=31;i++)dd.innerHTML+=`<option>${i}</option>`;mm.innerHTML='';["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"].forEach((v,i)=>mm.innerHTML+=`<option value="${i+1}">${v}</option>`);yy.innerHTML='';for(let i=2023;i<=2030;i++)yy.innerHTML+=`<option>${i}</option>`;let now=new Date();dd.value=now.getDate();mm.value=now.getMonth()+1;yy.value=now.getFullYear();}
function showTab(t){['emp','inv','acc','board'].forEach(x=>{let el=document.getElementById('tab-'+x);if(!el)return;if(x===t){el.classList.remove('hidden');el.style.display='block'}else{el.classList.add('hidden');el.style.display='none'}})}
function updateStates(){let c=document.getElementById('iCountry').value;let s=document.getElementById('iState');s.innerHTML='';if(c==='السودان'){SUDAN_STATES.forEach(v=>s.innerHTML+=`<option>${v}</option>`)}else{s.innerHTML='<option>غير مطلوب</option>'}updateCities()}
function updateCities(){let c=document.getElementById('iCountry').value;let ct=document.getElementById('iCity');ct.innerHTML='';(COUNTRY_CITIES[c]||["أخرى"]).forEach(v=>ct.innerHTML+=`<option>${v}</option>`)}
function updateItems(){let s=document.getElementById('iService').value;let it=document.getElementById('iItem');it.innerHTML='';(ITEMS[s]||["عام"]).forEach(v=>it.innerHTML+=`<option>${v}</option>`)}
function saveAll(){localStorage.setItem('emps',JSON.stringify(emps));localStorage.setItem('invs',JSON.stringify(invs));localStorage.setItem('acc',JSON.stringify(acc));localStorage.setItem('board',JSON.stringify(board));localStorage.setItem('leaves',JSON.stringify(leaves))}
let editEmpIdx=-1;let leaves=JSON.parse(localStorage.getItem('leaves')||'[]');
function addEmp(){let e={name:document.getElementById('eName').value,site:document.getElementById('eSite').value||'عام',phone:document.getElementById('ePhoneCode').value+' '+document.getElementById('ePhone').value,job:document.getElementById('eJob').value,salary:document.getElementById('eSalary').value,res:document.getElementById('eRes').value,nid:document.getElementById('eNid').value,idType:document.getElementById('eIdType').value,idNum:document.getElementById('eIdNum').value,idIssue:document.getElementById('eIdDay').value+'/'+document.getElementById('eIdMonth').value+'/'+document.getElementById('eIdYear').value,idExp:document.getElementById('eIdExpDay').value+'/'+document.getElementById('eIdExpMonth').value+'/'+document.getElementById('eIdExpYear').value,dept:document.getElementById('eDept').value,emerg:document.getElementById('eEmerg').value};if(!e.name)return alert('اكتب اسم الموظف');if(editEmpIdx>=0){emps[editEmpIdx]=e;editEmpIdx=-1;alert('تم تعديل الموظف')}else{emps.push(e);alert('تم حفظ الموظف')};saveAll();showEmps();showLeaves();}
function editEmp(i){let e=emps[i];if(!e)return;editEmpIdx=i;document.getElementById('eName').value=e.name||'';document.getElementById('eRes').value=e.res||'';document.getElementById('ePhone').value=(e.phone||'').split(' ').pop();document.getElementById('eNid').value=e.nid||'';document.getElementById('eIdType').value=e.idType||'بطاقة شخصية';document.getElementById('eIdNum').value=e.idNum||'';document.getElementById('eJob').value=e.job||'عامل';document.getElementById('eSite').value=e.site||'';document.getElementById('eDept').value=e.dept||'';document.getElementById('eSalary').value=e.salary||'';document.getElementById('eEmerg').value=e.emerg||'';window.scrollTo(0,0);alert('عدل البيانات ثم دوس حفظ الموظف')}
function addLeave(){let name=document.getElementById('eName').value;if(!name)return alert('اكتب اسم الموظف أولا');let l={name:name,type:document.getElementById('eLeaveType').value,from:document.getElementById('eLeaveFrom').value,to:document.getElementById('eLeaveTo').value};leaves.push(l);localStorage.setItem('leaves',JSON.stringify(leaves));showLeaves();alert('تم حفظ الإجازة')}
function showLeaves(){let el=document.getElementById('leaveList');if(!el)return;el.innerHTML=leaves.map((l,i)=>`<div class="card">${l.name} - ${l.type} - من ${l.from} إلى ${l.to} <button class="red" onclick="leaves.splice(${i},1);localStorage.setItem('leaves',JSON.stringify(leaves));showLeaves()">حذف</button></div>`).join('')||'لا توجد إجازات';}
function checkExpiry(){let now=new Date();let warn=[];emps.forEach(e=>{if(!e.idExp)return;let parts=e.idExp.split('/');let d=new Date(parts[2],parts[1]-1,parts[0]);let diff=Math.ceil((d-now)/(1000*60*60*24));if(diff>=0&&diff<=30)warn.push(e.name+' - تنتهي هويته بعد '+diff+' يوم ('+e.idExp+')');if(diff<0)warn.push(e.name+' - هويته منتهية ('+e.idExp+')')});let a=document.getElementById('expiryAlert');if(a)a.innerHTML=warn.length?'⚠️ تنبيه انتهاء هوية:<br>'+warn.join('<br>'):'';}
function showEmps(){let f=document.getElementById('siteFilter').value;let list=document.getElementById('empList');let sites=[...new Set(emps.map(e=>e.site))];let sf=document.getElementById('siteFilter');sf.innerHTML='<option value="">كل المواقع</option>';sites.forEach(s=>sf.innerHTML+=`<option ${f===s?'selected':''}>${s}</option>`);let show=emps.filter(e=>!f||e.site===f);list.innerHTML=show.map((e,i)=>`<div class="card"><b>${e.name}</b> - ${e.job} - ${e.site}<br>الجوال: ${e.phone}<br>السكن: ${e.res||''}<br>الراتب: ${e.salary||0}<br>الرقم الوطني: ${e.nid||''}<br>${e.idType||''} - رقم الإثبات: ${e.idNum||''}<br>إصدار: ${e.idIssue||''} - انتهاء: ${e.idExp||''}<br>الإدارة: ${e.dept||''}<br>طوارئ: ${e.emerg||''}<br><button onclick="editEmp(${emps.indexOf(e)})">تعديل</button> <button class="red" onclick="delEmp(${emps.indexOf(e)})">حذف</button></div>`).join('')||'لا يوجد موظفين';checkExpiry();showLeaves();}
function delEmp(i){if(confirm('حذف الموظف؟')){emps.splice(i,1);saveAll();showEmps();}}
function addItem(){let q=+document.getElementById('iQty').value||1;let p=+document.getElementById('iPrice').value||0;let tp=document.getElementById('iService')?document.getElementById('iService').value:'';let st=document.getElementById('iServiceType')?document.getElementById('iServiceType').value:tp;let s=document.getElementById('iItem')?document.getElementById('iItem').value:tp;let m=document.getElementById('iMethod')?document.getElementById('iMethod').value:'';if(!s||q<=0||p<=0){alert('اكمل الصنف والكمية والسعر');return;}let it={tp:tp,st:st,s:s,service:tp,item:s,method:m,md:m,shipped:document.getElementById('iShipped')?document.getElementById('iShipped').value:'',qty:q,price:p,total:q*p};curItems.push(it);showItems();}
function addInvItem(){return addItem();}
function showItems(){let t=curItems.reduce((s,x)=>s+x.total,0);document.getElementById('invItems').innerHTML=curItems.map(x=>`<div>${x.tp||x.service} - ${x.st||''} - <b>${x.s||x.item}</b> - ${x.md||x.method} - ${x.shipped||''} - ${x.qty} × ${x.price} = ${x.total}</div>`).join('');document.getElementById('iTotal').value=t;document.getElementById('iTotalWords').innerText='المبلغ بالحروف: '+t+' جنيه فقط لا غير';}
function saveInv(){if(!curItems.length)return alert('أضف صنف أولا');let inv={client:document.getElementById('iClient').value||'عميل',date:document.getElementById('iDay').value+'/'+document.getElementById('iMonth').value+'/'+document.getElementById('iYear').value,total:+document.getElementById('iTotal').value,items:[...curItems]};invs.push(inv);acc.revs.push({desc:'فاتورة '+inv.client,amt:inv.total,date:inv.date});saveAll();curItems=[];showItems();showInvs();showSummary();alert('تم حفظ الفاتورة')}
function showInvs(){let q=(document.getElementById('invSearch')?.value||'').trim();let list=invs.map((v,i)=>({v,i})).filter(o=>!q||o.v.client.includes(q));document.getElementById('invList').innerHTML=list.map(o=>`<div class="card"><b>${o.v.client}</b> - ${o.v.date} - الإجمالي: ${o.v.total}<br>${o.v.items.map(x=>x.service+' / '+x.item+' / '+x.shipped).join(' | ')}<br><button onclick="printInv(${o.i})">طباعة</button> <button class="red" onclick="delInv(${o.i})">حذف</button></div>`).join('')||'لا توجد فواتير'}
function delInv(i){if(confirm('حذف الفاتورة؟')){invs.splice(i,1);saveAll();showInvs();showSummary();}}
function printInv(i){let v=invs[i];if(!v)return;let html=`<div style="text-align:center"><h2>شركة أبودومات للخدمات المتحدة المحدودة</h2><div>ABUDOMAT UNITED SERVICES CO. LTD</div><hr><h3>فاتورة</h3></div><p>العميل: ${v.client} - التاريخ: ${v.date}</p><table border="1" style="width:100%;border-collapse:collapse"><tr><th>الخدمة</th><th>الصنف</th><th>البيان</th><th>الكمية</th><th>السعر</th><th>الإجمالي</th></tr>${v.items.map(x=>`<tr><td>${x.service}</td><td>${x.item}</td><td>${x.shipped}</td><td>${x.qty}</td><td>${x.price}</td><td>${x.total}</td></tr>`).join('')}</table><h3>الإجمالي: ${v.total}</h3><p>شكرا لتعاملكم معنا</p>`;document.getElementById('printArea').innerHTML=html;window.print();}
function clearInvs(){if(confirm('حذف كل الفواتير؟')){invs=[];saveAll();showInvs();}}
function saveCapital(){acc.capital=+document.getElementById('aCapital').value||0;saveAll();showSummary();}
function addRev(){let a=+document.getElementById('rAmt').value||0;acc.revs.push({desc:document.getElementById('rDesc').value,amt:a,date:document.getElementById('rDay').value+'/'+document.getElementById('rMonth').value});saveAll();showSummary();}
function addExp(){let a=+document.getElementById('eAmt').value||0;acc.exps.push({desc:document.getElementById('eDesc').value,amt:a,date:document.getElementById('eDay').value+'/'+document.getElementById('eMonth').value});saveAll();showSummary();}
function showSummary(){let rev=acc.revs.reduce((s,x)=>s+x.amt,0);let exp=acc.exps.reduce((s,x)=>s+x.amt,0);let invRev=invs.reduce((s,x)=>s+x.total,0);document.getElementById('aCapital').value=acc.capital;document.getElementById('summary').innerHTML=`<table><tr><th>البيان</th><th>المبلغ</th></tr><tr><td>رأس المال</td><td>${acc.capital}</td></tr><tr><td>إيرادات الفواتير</td><td>${invRev}</td></tr><tr><td>إيرادات يدوية</td><td>${rev}</td></tr><tr><td>إجمالي الإيرادات</td><td>${rev+invRev}</td></tr><tr><td>المصروفات</td><td>${exp}</td></tr><tr><td><b>صافي الربح</b></td><td><b>${rev+invRev-exp}</b></td></tr></table>`;}
function addBoard(){let t=document.getElementById('bText').value;if(!t)return;board.push(t);saveAll();showBoard();}
function showBoard(){document.getElementById('boardList').innerHTML=board.map((b,i)=>`<div class="card">${b} <button class="red" onclick="board.splice(${i},1);saveAll();showBoard()">حذف</button></div>`).join('')}
function exportBackup(){let blob=new Blob([JSON.stringify({emps,invs,acc,board})],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='abodomat-backup.json';a.click();}
function importBackup(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=function(){try{let d=JSON.parse(r.result);emps=d.emps||emps;invs=d.invs||invs;acc=d.acc||acc;board=d.board||board;saveAll();showEmps();showInvs();showSummary();showBoard();alert('تم الاستيراد')}catch(err){alert('ملف غير صالح')}};r.readAsText(f);}
// init
document.getElementById('iCountry').innerHTML=Object.keys(COUNTRY_CITIES).map(c=>`<option>${c}</option>`).join('');
fillDate('eIdDay','eIdMonth','eIdYear');fillDate('eIdExpDay','eIdExpMonth','eIdExpYear');fillDate('iDay','iMonth','iYear');fillDate('rDay','rMonth','rYear');fillDate('eDay','eMonth','eYear');
updateStates();updateItems();showEmps();showInvs();showSummary();showBoard();showLeaves();
</script>
</body>
</html>
