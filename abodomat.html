<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>أبودومات - إدارة أعمال</title>
<style>
body{font-family:Arial;background:#eaf6fb;margin:0;padding:10px;direction:rtl;text-align:right}
h1{text-align:center;color:#0a4a5e;font-size:20px}
.card{background:#fff;border-radius:10px;padding:12px;margin:10px 0}
input,select,button,textarea{padding:9px;margin:4px 0;width:100%;box-sizing:border-box;border:1px solid #ccc;border-radius:6px;font-size:15px}
button{background:#0e7a9e;color:#fff;border:none;cursor:pointer}
button.red{background:#b00020}button.blue{background:#1565c0}button.orange{background:#ef6c00}button.green{background:#2e7d32}button.purple{background:#6a1b9a}button.dark{background:#333}
table{width:100%;border-collapse:collapse;background:#fff;min-width:1200px}td,th{border:1px solid #999;padding:6px;text-align:center;white-space:nowrap}
.scroll{overflow-x:auto;border:1px solid #999}.tabs{display:flex;gap:6px;flex-wrap:wrap}.tabs button{width:auto;padding:8px 14px}
.hidden{display:none}label{font-weight:bold;display:block;margin-top:8px}
.phoneRow{display:flex;gap:6px}.phoneRow .fixedCode{background:#e6f3f8;font-weight:bold;text-align:center;width:30%;border:1px solid #0e7a9e;border-radius:6px;padding:9px}.phoneRow input{width:70%}
.dateRow{display:flex;gap:6px}.dateRow select{flex:1}.hint{font-size:13px;color:#555}
.empPageBox{border:2px solid #0e7a9e;border-radius:10px;padding:12px;background:#eaf6fb;margin-top:10px}
.fileBox{border:1px solid #999;border-radius:8px;padding:10px;margin:8px 0;background:#fff}
.smallTable{width:100%;border-collapse:collapse;min-width:900px}.smallTable td,.smallTable th{border:1px solid #999;padding:7px 5px;text-align:center;font-size:14px;white-space:nowrap}
.smallTable button{width:auto;padding:6px 10px;font-size:13px;margin:2px}.smallScroll{overflow-x:auto;border:1px solid #999;background:#fff;margin:8px 0}
.logoBox,.logoBox2{text-align:center;background:#fff;border-radius:10px;padding:8px;margin:10px 0}.logoBox img,.logoBox2 img{width:100%;max-width:650px;border-radius:10px}
.backupBar{background:#fff;border:2px solid #0a4a5e;border-radius:10px;padding:10px;margin:10px 0;display:flex;flex-wrap:wrap;gap:6px}.backupBar button{width:auto;flex:1;min-width:130px;font-size:14px}
.jumpBar{background:#fff;border:2px solid #ef6c00;border-radius:10px;padding:10px;display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.jumpBar button{width:auto;flex:1;min-width:120px}
.navRow{display:flex;gap:6px}.navRow button{width:auto;flex:1}
.profitBox{border:2px solid #0e7a9e;border-radius:8px;padding:10px;margin:6px 0;background:#e6f3f8}
.profitBox table{width:100%;min-width:0;border-collapse:collapse;background:#fff}
.profitBox td,.profitBox th{border:1px solid #999;padding:8px;text-align:center}
@media print{.noPrint{display:none!important}}
@media (max-width:600px){body{padding:6px;font-size:16px}}
@media (min-width:700px){body{font-size:19px;line-height:1.7;padding:14px;max-width:1400px;margin:0 auto}h1,h2{font-size:26px}input,select,button,textarea{font-size:19px;min-height:48px;padding:12px}th,td{font-size:19px;padding:10px}.hint{font-size:15px}}
.expBox{border:2px solid #ef6c00;border-radius:10px;padding:12px;margin:12px 0;background:#fff3e0}
@media print{.noPrint{display:none!important}body{background-image:url('letterhead.jpg');background-size:100% 100%;background-repeat:no-repeat;-webkit-print-color-adjust:exact;print-color-adjust:exact;padding:0}}
</style>
</head>

<script>
function exportBackup(){var data={emps:emps,invs:invs,acc:acc,board:board};var b=new Blob([JSON.stringify(data)],{type:'application/json'});var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='Abodomat_Backup_'+new Date().toISOString().slice(0,10)+'.json';a.click();}
function importBackup(ev){var f=ev.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var d=JSON.parse(r.result);if(!d.emps&&!d.invs){alert('الملف ما نسخة احتياطية');return;}if(!confirm('استبدال كل البيانات؟'))return;emps=d.emps||[];invs=d.invs||[];acc=d.acc||{capital:0,exp:0,exps:[],revs:[]};board=d.board||[];if(!acc.exps)acc.exps=[];if(!acc.revs)acc.revs=[];saveAll();showEmps();showInvs();showAcc();alert('تم الاستيراد');}catch(e){alert('الملف تالف');}};r.readAsText(f);ev.target.value='';}
var MONTHS_AR=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
function pad2(n){n=String(n);return n.length<2?'0'+n:n;}
function datePickerHTML(base,val){var d='',m='',y='';if(val){var p=String(val).split('-');y=p[0]||'';m=p[1]||'';d=p[2]||'';}var dh='<select id="'+base+'_d"><option value="">اليوم</option>';for(var i=1;i<=31;i++){dh+='<option value="'+pad2(i)+'"'+(pad2(i)==d?' selected':'')+'>'+i+'</option>';}dh+='</select>';var mh='<select id="'+base+'_m"><option value="">الشهر</option>';MONTHS_AR.forEach(function(nm,idx){var v=pad2(idx+1);mh+='<option value="'+v+'"'+(v==m?' selected':'')+'>'+nm+'</option>';});mh+='</select>';var yh='<select id="'+base+'_y"><option value="">السنة</option>';for(var yr=2035;yr>=1950;yr--){yh+='<option value="'+yr+'"'+(String(yr)==String(y)?' selected':'')+'>'+yr+'</option>';}yh+='</select>';return dh+mh+yh;}
function buildDatePicker(base,val){var el=document.getElementById('row-'+base);if(el)el.innerHTML=datePickerHTML(base,val||'');}
function getD(base){var d=document.getElementById(base+'_d');var m=document.getElementById(base+'_m');var y=document.getElementById(base+'_y');if(!d||!m||!y)return '';if(!y.value||!m.value||!d.value)return '';return y.value+'-'+m.value+'-'+d.value;}
function setD(base,val){var d=document.getElementById(base+'_d');var m=document.getElementById(base+'_m');var y=document.getElementById(base+'_y');if(!d||!m||!y)return;if(!val){d.value='';m.value='';y.value='';return;}var p=String(val).split('-');y.value=p[0]||'';m.value=p[1]||'';d.value=p[2]||'';}
function goToSec(id){var el=document.getElementById(id);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});}
function checkExpiry(){try{var today=new Date();var soon=new Date();soon.setDate(today.getDate()+30);var t=today.toISOString().slice(0,10);var s=soon.toISOString().slice(0,10);var exp=[];emps.forEach(function(e){if(e.idExpiry){if(e.idExpiry<t)exp.push('⛔ انتهت: '+e.name+' - '+e.idExpiry);else if(e.idExpiry<=s)exp.push('⚠️ قربت تنتهي: '+e.name+' - '+e.idExpiry);}});var old=document.getElementById('expiryAlert');if(old)old.remove();if(exp.length){var d=document.createElement('div');d.id='expiryAlert';d.style.cssText='background:#ffebee;border:2px solid #b00020;border-radius:10px;padding:12px;margin:10px 0;font-weight:bold';d.innerHTML='🔔 تنبيه انتهاء الهوية - قبل شهر:<br>'+exp.join('<br>');var app=document.getElementById('appContent');if(app)app.insertBefore(d,app.children[1]);}}catch(e){}}
function backToEmpList(){var m=document.getElementById('empMain');var p=document.getElementById('empPageInside');if(m)m.classList.remove('hidden');if(p)p.classList.add('hidden');curEmpPage=-1;}
function delEmp(i){if(confirm('حذف الموظف؟')){emps.splice(i,1);saveAll();showEmps();}}

function calcPeriod(finalInvs,exps,revs,from,to){var r=0,e=0;finalInvs.forEach(function(v){if(v.date>=from&&v.date<=to)r+=Number(v.total||0);});(exps||[]).forEach(function(x){if(x.date>=from&&x.date<=to)e+=Number(x.amount||0);});(revs||[]).forEach(function(x){if(x.date>=from&&x.date<=to)r+=Number(x.amount||0);});return {r:r,e:e,p:r-e};}

el.innerHTML='<div class="profitBox"><h3>الحسابات - عام</h3><table><tr><th>البيان</th><th>المبلغ</th></tr><tr><td><b>رأس المال</b></td><td><b>'+acc.capital+'</b></td></tr><tr><td><b>إيرادات الفواتير</b></td><td><b>'+invRev+'</b></td></tr><tr><td><b>إيرادات يدوية</b></td><td><b>'+manualRev+'</b></td></tr><tr><td><b>إجمالي الإيرادات</b></td><td><b>'+rev+'</b></td></tr><tr><td><b>مصروفات</b></td><td><b>'+acc.exp+'</b></td></tr></table><div style="text-align:center"><h3>صافي الربح - تحت</h3><p><b>'+profit+'</b></p></div><p>المبلغ بالحروف: '+arWords(profit)+' جنيه فقط لا غير</p></div>'+
'<div class="profitBox"><h3>ربع سنوي - '+y+'</h3><table><tr><th>الربع</th><th>إيرادات</th><th>مصروفات</th></tr><tr><td>الربع الأول (يناير - مارس)</td><td>'+q1.r+'</td><td>'+q1.e+'</td></tr><tr><td>الربع الثاني (أبريل - يونيو)</td><td>'+q2.r+'</td><td>'+q2.e+'</td></tr><tr><td>الربع الثالث (يوليو - سبتمبر)</td><td>'+q3.r+'</td><td>'+q3.e+'</td></tr><tr><td>الربع الرابع (أكتوبر - ديسمبر)</td><td>'+q4.r+'</td><td>'+q4.e+'</td></tr></table><table><tr><th colspan="2">صافي الربح - تحت</th></tr><tr><td>الربع الأول</td><td><b>'+q1.p+'</b></td></tr><tr><td>الربع الثاني</td><td><b>'+q2.p+'</b></td></tr><tr><td>الربع الثالث</td><td><b>'+q3.p+'</b></td></tr><tr><td>الربع الرابع</td><td><b>'+q4.p+'</b></td></tr></table></div>'+
'<div class="profitBox"><h3>نصف سنوي - '+y+'</h3><table><tr><th>النصف</th><th>إيرادات</th><th>مصروفات</th></tr><tr><td>النصف الأول (يناير - يونيو)</td><td>'+h1.r+'</td><td>'+h1.e+'</td></tr><tr><td>النصف الثاني (يوليو - ديسمبر)</td><td>'+h2.r+'</td><td>'+h2.e+'</td></tr></table><table><tr><th colspan="2">صافي الربح - تحت</th></tr><tr><td>النصف الأول</td><td><b>'+h1.p+'</b></td></tr><tr><td>النصف الثاني</td><td><b>'+h2.p+'</b></td></tr></table></div>'+
'<div class="profitBox"><h3>سنوي</h3><table><tr><th>السنة</th><th>إيرادات</th><th>مصروفات</th></tr><tr><td>'+y+'</td><td>'+rev+'</td><td>'+acc.exp+'</td></tr></table><table><tr><th colspan="2">صافي الربح - تحت</th></tr><tr><td>'+y+'</td><td><b>'+profit+'</b></td></tr></table></div>';
document.getElementById('aCapital').value=acc.capital;document.getElementById('revList').innerHTML=acc.revs.map(function(x,i){return '<p>'+x.desc+' - '+x.amount+' - '+x.date+' <button class="red" onclick="delRevItem('+i+')">حذف</button></p>';}).join('');document.getElementById('expList').innerHTML=acc.exps.map(function(x,i){return '<p>'+x.desc+' - '+x.amount+' - '+x.date+' <button class="red" onclick="delExpItem('+i+')">حذف</button></p>';}).join('');}

function addExpItem(){var d=document.getElementById('expDesc').value.trim();var a=Number(document.getElementById('expAmount').value||0);if(!d||a<=0){alert('اكتب وصف ومبلغ المصروف');return;}if(!acc.exps)acc.exps=[];acc.exps.push({desc:d,amount:a,date:getD('expDate')||new Date().toISOString().slice(0,10)});acc.exp=(acc.exps||[]).reduce(function(s,x){return s+Number(x.amount||0);},0);saveAll();showAcc();document.getElementById('expDesc').value='';document.getElementById('expAmount').value='';}
function delExpItem(i){if(confirm('حذف المصروف؟')){acc.exps.splice(i,1);acc.exp=acc.exps.reduce(function(s,x){return s+Number(x.amount||0);},0);saveAll();showAcc();}}
function addRevItem(){var d=document.getElementById('revDesc').value.trim();var a=Number(document.getElementById('revAmount').value||0);if(!d||a<=0){alert('اكتب وصف ومبلغ الإيراد');return;}if(!acc.revs)acc.revs=[];acc.revs.push({desc:d,amount:a,date:getD('revDate')||new Date().toISOString().slice(0,10)});saveAll();showAcc();document.getElementById('revDesc').value='';document.getElementById('revAmount').value='';}
function delRevItem(i){if(confirm('حذف الإيراد؟')){acc.revs.splice(i,1);saveAll();showAcc();}}
function addInvItem(){var type=document.getElementById('iType').value;var st=document.getElementById('iServiceType').value;var it=document.getElementById('iService').value;var m=document.getElementById('iMethod').value;var q=Number(document.getElementById('iQty').value||1);var p=Number(document.getElementById('iPrice').value||0);if(p<=0){alert('اكتب السعر');return;}curItems.push({type:type,serviceType:st,service:it,method:m,qty:q,price:p,total:q*p});showCurItems();}
function showCurItems(){var el=document.getElementById('invItems');if(!el)return;el.innerHTML=curItems.map(function(x,i){return '<p>'+x.type+' | '+x.serviceType+' | '+x.service+' | '+x.method+' | الكمية: '+x.qty+' | السعر: '+x.price+' | الإجمالي: '+x.total+' <button class="red" onclick="delCurItem('+i+')">حذف</button></p>';}).join('');var t=curItems.reduce(function(s,x){return s+Number(x.total||0);},0);document.getElementById('iTotal').value=t;}
function delCurItem(i){curItems.splice(i,1);showCurItems();}
function saveInv(){if(!curItems.length){alert('أضف بند واحد على الأقل');return;}var client=document.getElementById('iClient').value.trim();if(!client){alert('اكتب اسم العميل');return;}var country=document.getElementById('iCountry').value;var state=country=='السودان'?document.getElementById('iState').value:'';var city=document.getElementById('iCity').value;var phone=document.getElementById('iCode').value+document.getElementById('iPhone').value.trim();var total=curItems.reduce(function(s,x){return s+Number(x.total||0);},0);invs.push({client:client,country:country,state:state,city:city,phone:phone,date:getD('iDate')||new Date().toISOString().slice(0,10),invType:document.getElementById('iInvType').value,items:curItems,total:total});curItems=[];showCurItems();saveAll();showInvs();alert('تم حفظ الفاتورة');document.getElementById('iClient').value='';document.getElementById('iPhone').value='';}
function showInvs(){var el=document.getElementById('invList');if(!el)return;var q=(document.getElementById('invSearch').value||'').toLowerCase();var list=invs.filter(function(v){return (v.client||'').toLowerCase().includes(q)||String(invs.indexOf(v)+1).includes(q);});el.innerHTML='<table><tr><th>م</th><th>العميل</th><th>الدولة / الولاية / المدينة</th><th>الجوال</th><th>التاريخ</th><th>نوع الفاتورة</th><th>الخدمات</th><th>الإجمالي</th><th>طباعة</th><th>حذف</th></tr>'+list.map(function(v){var idx=invs.indexOf(v);var itemsHtml=v.items.map(function(x){return x.type+' | '+x.serviceType+' | '+x.service+' | '+x.method+' | '+x.qty+' × '+x.price+' = '+x.total;}).join('<br>');return '<tr><td>'+(idx+1)+'</td><td><b>'+v.client+'</b></td><td>'+v.country+' / '+(v.state||'')+' / '+(v.city||'')+'</td><td><span dir="ltr">'+v.phone+'</span></td><td>'+v.date+'</td><td>'+(v.invType||'فاتورة نهائية')+'</td><td>'+itemsHtml+'</td><td><b>'+v.total+'</b></td><td><button class="blue" onclick="printInv('+idx+')">طباعة</button></td><td><button class="red" onclick="delInv('+idx+')">حذف</button></td></tr>';}).join('')+'</table><p>عدد الفواتير: '+invs.length+'</p>';}
function delInv(i){if(confirm('حذف الفاتورة؟')){invs.splice(i,1);saveAll();showInvs();}}
function clearInvs(){if(confirm('حذف كل الفواتير؟')){invs=[];saveAll();showInvs();}}
function printInv(i){var v=invs[i];var rows=v.items.map(function(x,j){return '<tr><td>'+(j+1)+'</td><td>'+x.type+'</td><td>'+x.serviceType+'</td><td>'+x.service+'</td><td>'+x.method+'</td><td>'+x.qty+'</td><td>'+x.price+'</td><td>'+x.total+'</td></tr>';}).join('');var body='<p><b>رقم الفاتورة:</b> '+(i+1)+' | <b>نوع الفاتورة:</b> '+(v.invType||'فاتورة نهائية')+' | <b>التاريخ:</b> '+v.date+'</p><p><b>اسم العميل:</b> '+v.client+'</p><p><b>العنوان:</b> '+v.country+' / '+(v.state||'')+' / '+(v.city||'')+'</p><p><b>جوال العميل:</b> <span dir="ltr">'+v.phone+'</span></p><table><tr><th>م</th><th>الخدمات</th><th>الخدمة المطلوبة</th><th>الصنف</th><th>طريقة تقديم الخدمة</th><th>الكمية</th><th>السعر</th><th>الإجمالي</th></tr>'+rows+'</table><h3>الإجمالي الكلي: '+v.total+'</h3><p>المبلغ بالحروف: '+arWords(v.total)+' جنيه فقط لا غير</p>';printLetterHead((v.invType||'فاتورة')+' - '+v.client,body);}
function printAllInvsPDF(){if(!invs.length){alert('ما في فواتير');return;}var rows=invs.map(function(v,i){return '<tr><td>'+(i+1)+'</td><td>'+v.client+'</td><td>'+v.country+' / '+(v.state||'')+' / '+(v.city||'')+'</td><td>'+v.phone+'</td><td>'+v.date+'</td><td>'+(v.invType||'فاتورة نهائية')+'</td><td>'+v.items.map(function(x){return x.service+' ('+x.qty+' × '+x.price+')';}).join(' - ')+'</td><td>'+v.total+'</td></tr>';}).join('');var total=invs.reduce(function(s,v){return s+Number(v.total||0);},0);var body='<p><b>عدد الفواتير:</b> '+invs.length+' | <b>الإجمالي:</b> '+total+'</p><table><tr><th>م</th><th>العميل</th><th>العنوان</th><th>الجوال</th><th>التاريخ</th><th>النوع</th><th>الخدمات</th><th>الإجمالي</th></tr>'+rows+'</table>';printLetterHead('كشف الفواتير',body);}
